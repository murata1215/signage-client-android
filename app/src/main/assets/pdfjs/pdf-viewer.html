<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #pdf-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            position: absolute;
        }
        .hidden-canvas {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div id="pdf-container">
        <canvas id="pdf-canvas-a"></canvas>
        <canvas id="pdf-canvas-b" class="hidden-canvas"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = '';

        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let pageDuration = 10;
        let pageTimer = null;

        // Two-canvas swap
        const canvasA = document.getElementById('pdf-canvas-a');
        const canvasB = document.getElementById('pdf-canvas-b');
        let frontCanvas = canvasA;
        let backCanvas = canvasB;

        let firstPageOnlyMode = false;
        let isRendering = false;
        let dualPageMode = false;  // A4縦検出時にtrue
        let pageStep = 1;         // 1=通常, 2=デュアルページ

        async function loadPdfFromData(data, firstPageOnly) {
            try {
                firstPageOnlyMode = !!firstPageOnly;
                const loadingTask = pdfjsLib.getDocument({ data: data });
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                currentPage = 1;

                // 1ページ目のアスペクト比で縦長判定
                // firstPageOnlyモードではデュアル無効（Android側で別PDFを並べる）
                const firstPage = await pdfDoc.getPage(1);
                const vp = firstPage.getViewport({ scale: 1 });
                dualPageMode = !firstPageOnlyMode && (vp.height > vp.width) && totalPages >= 2;
                pageStep = dualPageMode ? 2 : 1;

                await renderCurrentPages();
                if (!firstPageOnlyMode) {
                    startPageRotation();
                }
            } catch (err) {
                console.error('PDF load error:', err);
            }
        }

        /**
         * 現在のcurrentPageから pageStep 分のページを描画する。
         * dualPageMode時は2ページを左右に並べて1つのcanvasに描画。
         */
        async function renderCurrentPages() {
            if (!pdfDoc || isRendering) return;
            isRendering = true;
            try {
                if (dualPageMode) {
                    await renderDualPage(currentPage);
                } else {
                    await renderSinglePage(currentPage);
                }
            } catch (err) {
                console.error('Render error:', err);
            } finally {
                isRendering = false;
            }
        }

        async function renderSinglePage(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            const viewport = page.getViewport({ scale: 1 });

            const scaleX = containerWidth / viewport.width;
            const scaleY = containerHeight / viewport.height;
            const cssScale = Math.min(scaleX, scaleY);
            const renderScale = cssScale * dpr;
            const scaledViewport = page.getViewport({ scale: renderScale });

            // Render to back canvas at high resolution
            backCanvas.width = scaledViewport.width;
            backCanvas.height = scaledViewport.height;
            // CSS size = actual display size
            backCanvas.style.width = Math.floor(scaledViewport.width / dpr) + 'px';
            backCanvas.style.height = Math.floor(scaledViewport.height / dpr) + 'px';
            const ctx = backCanvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;

            swapCanvases();
            notifyPageChanged();
        }

        async function renderDualPage(startPageNum) {
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            const gap = 8; // CSS pixels between pages

            // Left page (always exists)
            const leftPage = await pdfDoc.getPage(startPageNum);
            const leftVp = leftPage.getViewport({ scale: 1 });

            // Right page (may not exist for odd last page)
            const rightPageNum = startPageNum + 1;
            const hasRightPage = rightPageNum <= totalPages;
            let rightPage = null;
            let rightVp = null;
            if (hasRightPage) {
                rightPage = await pdfDoc.getPage(rightPageNum);
                rightVp = rightPage.getViewport({ scale: 1 });
            }

            // Calculate CSS scale to fit both pages side by side
            const singlePageWidth = leftVp.width;
            const singlePageHeight = leftVp.height;
            const totalNaturalWidth = hasRightPage
                ? singlePageWidth * 2 + gap
                : singlePageWidth;

            const scaleX = containerWidth / totalNaturalWidth;
            const scaleY = containerHeight / singlePageHeight;
            const cssScale = Math.min(scaleX, scaleY);
            const renderScale = cssScale * dpr;

            const pageW = Math.floor(singlePageWidth * renderScale);
            const pageH = Math.floor(singlePageHeight * renderScale);
            const scaledGap = hasRightPage ? Math.floor(gap * renderScale) : 0;
            const canvasW = hasRightPage ? pageW * 2 + scaledGap : pageW;

            // Setup back canvas at high resolution
            backCanvas.width = canvasW;
            backCanvas.height = pageH;
            backCanvas.style.width = Math.floor(canvasW / dpr) + 'px';
            backCanvas.style.height = Math.floor(pageH / dpr) + 'px';
            const ctx = backCanvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvasW, pageH);

            // Render left page
            const leftScaledVp = leftPage.getViewport({ scale: renderScale });
            const leftOff = document.createElement('canvas');
            leftOff.width = pageW;
            leftOff.height = pageH;
            await leftPage.render({
                canvasContext: leftOff.getContext('2d'),
                viewport: leftScaledVp
            }).promise;
            ctx.drawImage(leftOff, 0, 0);

            // Render right page (if exists)
            if (hasRightPage && rightPage) {
                const rightScaledVp = rightPage.getViewport({ scale: renderScale });
                const rightOff = document.createElement('canvas');
                rightOff.width = pageW;
                rightOff.height = pageH;
                await rightPage.render({
                    canvasContext: rightOff.getContext('2d'),
                    viewport: rightScaledVp
                }).promise;
                ctx.drawImage(rightOff, pageW + scaledGap, 0);
            }

            swapCanvases();
            notifyPageChanged();
        }

        function swapCanvases() {
            backCanvas.classList.remove('hidden-canvas');
            frontCanvas.classList.add('hidden-canvas');
            const temp = frontCanvas;
            frontCanvas = backCanvas;
            backCanvas = temp;
        }

        function notifyPageChanged() {
            if (window.SignageInterface) {
                if (dualPageMode) {
                    const endPage = Math.min(currentPage + 1, totalPages);
                    // Report as "1-2/14" style via current=displayPage, total=totalPages
                    window.SignageInterface.onPageChanged(currentPage, totalPages);
                } else {
                    window.SignageInterface.onPageChanged(currentPage, totalPages);
                }
            }
        }

        // setTimeout chain
        function startPageRotation() {
            stopPageTimer();
            if (totalPages <= 1) return;
            // For dual mode with single page total, no rotation needed
            if (dualPageMode && totalPages <= 2) return;
            scheduleNextPage();
        }

        function scheduleNextPage() {
            pageTimer = setTimeout(async () => {
                const nextStart = currentPage + pageStep;
                if (nextStart > totalPages) {
                    // All pages shown
                    stopPageTimer();
                    if (window.SignageInterface) {
                        window.SignageInterface.onAllPagesCompleted();
                    }
                    return;
                }
                currentPage = nextStart;
                await renderCurrentPages();
                if (pageTimer !== null) {
                    scheduleNextPage();
                }
            }, pageDuration * 1000);
        }

        function stopPageTimer() {
            if (pageTimer !== null) {
                clearTimeout(pageTimer);
                pageTimer = null;
            }
        }

        // Called from Android
        window.loadPdfBase64 = function(base64Data, duration, firstPageOnly) {
            stopPageTimer();
            pageDuration = duration || 10;
            try {
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                loadPdfFromData(bytes.buffer, firstPageOnly);
            } catch (err) {
                console.error('Base64 decode error:', err);
            }
        };

        /**
         * 2つのPDFの1ページ目を左右に並べて表示する（firstPageOnly + 縦長PDF用）。
         * Android側から2つのBase64文字列を渡す。
         */
        window.loadDualFirstPages = function(base64Left, base64Right) {
            stopPageTimer();
            firstPageOnlyMode = true;
            dualPageMode = false;
            (async () => {
                try {
                    if (isRendering) return;
                    isRendering = true;

                    function decodeBase64(b64) {
                        const bin = atob(b64);
                        const bytes = new Uint8Array(bin.length);
                        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                        return bytes.buffer;
                    }

                    const leftDoc = await pdfjsLib.getDocument({ data: decodeBase64(base64Left) }).promise;
                    const rightDoc = await pdfjsLib.getDocument({ data: decodeBase64(base64Right) }).promise;
                    const leftPage = await leftDoc.getPage(1);
                    const rightPage = await rightDoc.getPage(1);

                    const containerWidth = window.innerWidth;
                    const containerHeight = window.innerHeight;
                    const dpr = window.devicePixelRatio || 1;
                    const gap = 8; // CSS pixels

                    const leftVp = leftPage.getViewport({ scale: 1 });
                    const rightVp = rightPage.getViewport({ scale: 1 });

                    // Use the taller page's aspect ratio for scaling
                    const maxHeight = Math.max(leftVp.height, rightVp.height);
                    const maxWidth = Math.max(leftVp.width, rightVp.width);
                    const totalNaturalWidth = maxWidth * 2 + gap;

                    const scaleX = containerWidth / totalNaturalWidth;
                    const scaleY = containerHeight / maxHeight;
                    const cssScale = Math.min(scaleX, scaleY);
                    const renderScale = cssScale * dpr;

                    const pageW = Math.floor(maxWidth * renderScale);
                    const pageH = Math.floor(maxHeight * renderScale);
                    const scaledGap = Math.floor(gap * renderScale);
                    const canvasW = pageW * 2 + scaledGap;

                    backCanvas.width = canvasW;
                    backCanvas.height = pageH;
                    backCanvas.style.width = Math.floor(canvasW / dpr) + 'px';
                    backCanvas.style.height = Math.floor(pageH / dpr) + 'px';
                    const ctx = backCanvas.getContext('2d');
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvasW, pageH);

                    // Left page
                    const leftScaled = leftPage.getViewport({ scale: renderScale });
                    const leftOff = document.createElement('canvas');
                    leftOff.width = Math.floor(leftScaled.width);
                    leftOff.height = Math.floor(leftScaled.height);
                    await leftPage.render({ canvasContext: leftOff.getContext('2d'), viewport: leftScaled }).promise;
                    const leftX = Math.floor((pageW - leftOff.width) / 2);
                    const leftY = Math.floor((pageH - leftOff.height) / 2);
                    ctx.drawImage(leftOff, leftX, leftY);

                    // Right page
                    const rightScaled = rightPage.getViewport({ scale: renderScale });
                    const rightOff = document.createElement('canvas');
                    rightOff.width = Math.floor(rightScaled.width);
                    rightOff.height = Math.floor(rightScaled.height);
                    await rightPage.render({ canvasContext: rightOff.getContext('2d'), viewport: rightScaled }).promise;
                    const rightX = pageW + scaledGap + Math.floor((pageW - rightOff.width) / 2);
                    const rightY = Math.floor((pageH - rightOff.height) / 2);
                    ctx.drawImage(rightOff, rightX, rightY);

                    swapCanvases();

                    // Clean up
                    leftDoc.destroy();
                    rightDoc.destroy();

                    totalPages = 2;
                    currentPage = 1;
                    if (window.SignageInterface) {
                        window.SignageInterface.onPageChanged(1, 2);
                    }
                } catch (err) {
                    console.error('Dual first pages error:', err);
                } finally {
                    isRendering = false;
                }
            })();
        };

        window.stopPdf = function() {
            stopPageTimer();
        };

        window.getPageInfo = function() {
            return JSON.stringify({ current: currentPage, total: totalPages, dual: dualPageMode, step: pageStep });
        };

        // Handle resize
        window.addEventListener('resize', () => {
            if (pdfDoc) {
                renderCurrentPages();
            }
        });

        // Signal ready to Android
        if (window.SignageInterface) {
            window.SignageInterface.onPdfViewerReady();
        }
    </script>
</body>
</html>
