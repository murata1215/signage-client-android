<!DOCTYPE html>
<!--
  YouTube動画再生用ラッパー (v1.85)
  YouTube IFrame Player API を使い、AndroidPlayerActivity(SignageInterface)から
  ytPlay()/ytStop() で制御される。

  設計方針:
  - 動画ID/ミュート/自動再生の指定は、AndroidがCONFIGプレースホルダを置換した状態で
    このHTML自体を loadDataWithBaseURL() で読み込む(v1.84)。
    以前は onPageFinished 後に evaluateJavascript() で渡していたが、
    loadDataWithBaseURL のURL正規化で baseUrl に末尾スラッシュが付与されるため
    onPageFinished 側のURL比較が常にfalseになり ytLoad() が一度も呼ばれない
    バグがあった。HTMLに値を埋め込む方式にしてタイミング依存を根絶する。
  - 先読み時はautoplay=falseでロードのみ行い、再生はしない
    (3枚WebViewローテーションの非表示WebViewで裏再生され音が鳴るのを防止)
  - アクティブ昇格時にAndroid側からytPlay()が呼ばれて初めて再生開始
  - onStateChange(ENDED) / onError はSignageInterfaceへ通知し、Android側で次画面へ進む判断をする
  - 各段階をSignageInterface.onYoutubeLog()でAndroid側デバッグオーバーレイに送る(v1.84)
  - このHTMLは file:///android_asset/ から直接loadUrl()せず、PlayerActivity側で
    loadDataWithBaseURL("https://www.youtube.com", ...) 経由で読み込むこと(v1.83)。
    file:// originのままIFrame APIを使うとorigin検証に失敗しエラー153になるため。
  - 再生開始watchdog(v1.85): onReadyが来てYT.Playerが生成されても、YouTube側が
    エラーコード152等をプレイヤー内部UIとして表示するだけでonErrorを発火させない
    ケースがある。この場合、onReady後に再生状態をポーリングし、一定時間内に
    再生が始まらなければ onYoutubeStalled() をAndroid側へ通知する。
    Android側はこれを受けて「loadDataWithBaseURL経由のラッパーHTML」を介さず
    YouTubeの/embed/ページへ直接loadUrl()するフォールバックに切り替える。
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }
    #player-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #yt-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="player-container">
    <div id="yt-player"></div>
  </div>

  <script>
    // Android側(buildYoutubeHtml)がプレースホルダを実値に置換してから読み込む(v1.84)
    var CONFIG = {
      videoId: '__VIDEO_ID__',
      muted: __MUTED__,
      autoplay: __AUTOPLAY__
    };

    var player = null;
    var apiReady = false;
    var apiFailTimer = null;
    var readyWatchdogTimer = null;
    var playWatchdogTimer = null;
    var playWatchdogElapsed = 0;
    var stalledNotified = false;
    var currentMuted = true;

    // 再生開始watchdogの猶予秒数(v1.85): onReady後この秒数以内に再生状態(PLAYING)へ
    // 遷移しなければ再生不能とみなしonYoutubeStalled()を通知する
    var PLAY_WATCHDOG_SEC = 12;

    function notify(fn) {
      try {
        if (window.SignageInterface && typeof window.SignageInterface[fn] === 'function') {
          return function() {
            window.SignageInterface[fn].apply(window.SignageInterface, arguments);
          };
        }
      } catch (e) { /* WebView外(ブラウザ確認等)では何もしない */ }
      return function() {};
    }

    function log(msg) {
      try { notify('onYoutubeLog')(String(msg)); } catch (e) {}
    }

    // 環境ログ(v1.85): 実機の実UA/実オリジン/Refererをデバッグオーバーレイで直読できるようにする
    try {
      log('env href=' + location.href);
      log('env referrer=' + document.referrer);
      log('env ua=' + navigator.userAgent);
    } catch (e) {}

    log('script start videoId=' + CONFIG.videoId + ' muted=' + CONFIG.muted + ' autoplay=' + CONFIG.autoplay);

    // IFrame API のロードに失敗した場合(プロキシ遮断・オフライン等)、
    // 一定時間onYouTubeIframeAPIReadyが来なければエラー通知して再生が固まらないようにする。
    apiFailTimer = setTimeout(function() {
      if (!apiReady) {
        log('api load timeout(10s)');
        notify('onYoutubeError')(-1);
      }
    }, 10000);

    // YouTube IFrame API本体を読み込み
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // グローバルコールバック(YouTube IFrame APIの規約)
    window.onYouTubeIframeAPIReady = function() {
      apiReady = true;
      log('api ready');
      if (apiFailTimer) { clearTimeout(apiFailTimer); apiFailTimer = null; }
      doLoad(CONFIG.videoId, CONFIG.muted, CONFIG.autoplay);
    };

    function doLoad(videoId, muted, autoplay) {
      currentMuted = muted;
      if (player) {
        try { player.destroy(); } catch (e) {}
        player = null;
      }
      if (playWatchdogTimer) { clearInterval(playWatchdogTimer); playWatchdogTimer = null; }
      playWatchdogElapsed = 0;
      stalledNotified = false;
      // プレイヤー生成watchdog: 15秒以内にonReadyが来なければ次へ進めるようエラー通知(v1.84)
      readyWatchdogTimer = setTimeout(function() {
        log('onReady watchdog timeout(15s)');
        notify('onYoutubeError')(-2);
      }, 15000);
      player = new YT.Player('yt-player', {
        videoId: videoId,
        playerVars: {
          controls: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          iv_load_policy: 3,
          fs: 0,
          disablekb: 1,
          autoplay: autoplay ? 1 : 0,
          // enablejsapi=1相当(IFrame API使用時は暗黙的に有効)でorigin検証が行われるため、
          // このページの読み込み元(loadDataWithBaseURLで付与するbaseUrl)と一致させる。
          // 不一致だとエラー153(invalid embed / referer未確認)になる(v1.83)
          origin: 'https://www.youtube.com'
        },
        events: {
          onReady: function(event) {
            if (readyWatchdogTimer) { clearTimeout(readyWatchdogTimer); readyWatchdogTimer = null; }
            log('onReady');
            if (currentMuted) {
              try { event.target.mute(); } catch (e) {}
            }
            if (autoplay) {
              try { event.target.playVideo(); } catch (e) {}
              startPlayWatchdog();
            }
            notify('onYoutubeReady')();
          },
          onStateChange: function(event) {
            log('stateChange=' + event.data);
            // YT.PlayerState.PLAYING === 1: 再生が始まったのでwatchdogは不要
            if (event.data === 1 && playWatchdogTimer) {
              clearInterval(playWatchdogTimer);
              playWatchdogTimer = null;
              log('watch cleared(playing)');
            }
            // YT.PlayerState.ENDED === 0
            if (event.data === 0) {
              if (playWatchdogTimer) { clearInterval(playWatchdogTimer); playWatchdogTimer = null; }
              notify('onYoutubeEnded')();
            }
          },
          onError: function(event) {
            log('onError code=' + event.data);
            if (playWatchdogTimer) { clearInterval(playWatchdogTimer); playWatchdogTimer = null; }
            notify('onYoutubeError')(event.data);
          }
        }
      });
      log('player created');
    }

    /**
     * 再生開始watchdog(v1.85): onReady後、再生状態が実際にPLAYINGへ遷移するかを監視する。
     * 152等のエラーはonErrorを発火させずプレイヤー内部UIとして表示されるだけのことがあるため、
     * 状態とcurrentTimeの実測でしか検知できない。PLAY_WATCHDOG_SEC以内にPLAYINGへ
     * 遷移しなければ、再生不能とみなしonYoutubeStalled()を通知する。
     */
    function startPlayWatchdog() {
      if (playWatchdogTimer) { clearInterval(playWatchdogTimer); playWatchdogTimer = null; }
      playWatchdogElapsed = 0;
      playWatchdogTimer = setInterval(function() {
        playWatchdogElapsed++;
        var state = -99;
        var t = -1;
        try { if (player && typeof player.getPlayerState === 'function') { state = player.getPlayerState(); } } catch (e) {}
        try { if (player && typeof player.getCurrentTime === 'function') { t = player.getCurrentTime(); } } catch (e) {}
        log('watch state=' + state + ' t=' + (typeof t === 'number' ? t.toFixed(2) : t));
        // YT.PlayerState.PLAYING === 1
        if (state === 1) {
          clearInterval(playWatchdogTimer);
          playWatchdogTimer = null;
          return;
        }
        if (playWatchdogElapsed >= PLAY_WATCHDOG_SEC) {
          clearInterval(playWatchdogTimer);
          playWatchdogTimer = null;
          if (!stalledNotified) {
            stalledNotified = true;
            log('watchdog: playback did not start within ' + PLAY_WATCHDOG_SEC + 's');
            notify('onYoutubeStalled')();
          }
        }
      }, 1000);
    }

    /** アクティブ昇格時にAndroidから呼ばれ、再生を開始する */
    window.ytPlay = function() {
      if (player && typeof player.playVideo === 'function') {
        try { player.playVideo(); } catch (e) {}
      }
    };

    /** 非アクティブ降格時にAndroidから呼ばれ、再生を停止する(裏で音が鳴るのを防止) */
    window.ytStop = function() {
      if (player && typeof player.pauseVideo === 'function') {
        try { player.pauseVideo(); } catch (e) {}
      }
    };
  </script>
</body>
</html>
